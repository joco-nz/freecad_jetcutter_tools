<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- FreeCAD Neutral Shaded Plane Base -->
  <polygon points="12,44 40,54 56,26 28,16" fill="#E9ECEF" stroke="#212529" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- "The Rest of the Shape" context lines (dashed / muted) -->
  <line x1="12" y1="44" x2="12" y2="20" stroke="#6C757D" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="40" y1="54" x2="40" y2="30" stroke="#6C757D" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="28" y1="16" x2="28" y2="6"  stroke="#6C757D" stroke-width="1.5" stroke-dasharray="3,3" />
  
  <!-- MATCHING EDGES (FreeCAD Primary Tufts Blue #418FDE) -->
  <line x1="56" y1="26" x2="28" y2="16" stroke="#418FDE" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- INITIAL SELECTED EDGE (FreeCAD Accent Light Red #FF585D) -->
  <line x1="12" y1="44" x2="40" y2="54" stroke="#FF585D" stroke-width="4.5" stroke-linecap="round" />

  <!-- Macro Magic / Selection Indicators -->
  <path d="M6,34 L14,40 L16,30 Z" fill="#212529" />
  <path d="M46,12 L50,22 L42,20 Z" fill="#418FDE" />
  
  <!-- Equality "=" Math indicator -->
  <g transform="translate(28, 30) rotate(18)">
    <rect x="0" y="0" width="10" height="2" fill="#418FDE" />
    <rect x="0" y="4" width="10" height="2" fill="#418FDE" />
  </g>
</svg>
